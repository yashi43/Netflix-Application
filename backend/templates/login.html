{% extends "base.html" %}

{% block title %}Login | Netflix{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 450px;
        margin: 60px auto;
        background: #15151c;
        padding: 40px;
        border-radius: 12px;
    }

    .auth-container h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #ccc;
    }

    .form-group input {
        width: 100%;
        padding: 13px;
        background: #0b0b0f;
        border: 1px solid #333;
        border-radius: 6px;
        color: white;
        font-size: 15px;
    }

    .form-group input:focus {
        outline: none;
        border-color: #e50914;
    }

    .login-btn {
        width: 100%;
        border: none;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
    }

    .error {
        background: #3a1518;
        color: #ff7777;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 20px;
        text-align: center;
    }
</style>
{% endblock %}


{% block content %}

<div class="auth-container">

    <h1>Welcome Back</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >
        </div>


        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </div>


        <button type="submit" class="btn login-btn">
            Login
        </button>

    </form>
        <div style="text-align: center; margin-top: 20px; color: #999;">
        Don't have an account?
        <a href="{% url 'signup' %}" style="color: #e50914; font-weight: bold;">
            Create Account
        </a>
    </div>

</div>

{% endblock %}

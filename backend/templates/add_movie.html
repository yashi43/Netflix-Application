{% extends "base.html" %}

{% block title %}Add Movie |Netflix{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 800px;
        margin: 20px auto;
        background: #15151c;
        padding: 40px;
        border-radius: 12px;
    }

    .form-container h1 {
        margin-bottom: 30px;
        font-size: 32px;
    }

    .movie-form p {
        margin-bottom: 20px;
    }

    .movie-form label {
        display: block;
        margin-bottom: 8px;
        color: #ccc;
        font-weight: bold;
    }

    .movie-form input,
    .movie-form textarea,
    .movie-form select {
        width: 100%;
        padding: 12px;
        background: #0b0b0f;
        border: 1px solid #333;
        border-radius: 6px;
        color: white;
        font-size: 15px;
    }

    .movie-form textarea {
        min-height: 120px;
        resize: vertical;
    }

    .movie-form input:focus,
    .movie-form textarea:focus,
    .movie-form select:focus {
        outline: none;
        border-color: #e50914;
    }

    .helptext {
        display: block;
        color: #777;
        margin-top: 5px;
        font-size: 13px;
    }

    .errorlist {
        color: #ff7777;
        margin-bottom: 8px;
        list-style: none;
    }

    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
    }

    .submit-btn {
        border: none;
        cursor: pointer;
        font-size: 16px;
    }

    .cancel-btn {
        background: #33333b;
        padding: 10px 18px;
        border-radius: 5px;
    }

    .cancel-btn:hover {
        background: #44444d;
    }
</style>
{% endblock %}


{% block content %}

<div class="form-container">

    <h1>Add New Movie</h1>

    <form method="POST" class="movie-form">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">

            <button type="submit" class="btn submit-btn">
                Add Movie
            </button>

            <a href="{% url 'home' %}" class="cancel-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}

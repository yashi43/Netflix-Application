<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Netflix{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: #ffffff;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 70px;
            background: #111116;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid #25252d;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links a {
            color: #ddd;
            font-size: 15px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* =========================
           BUTTON
        ========================= */

        .btn {
            background: #e50914;
            color: white !important;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .btn:hover {
            background: #b20710;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 90%;
            max-width: 1400px;
            margin: auto;
            padding: 35px 0;
        }

        /* =========================
           MESSAGES
        ========================= */

        .message {
            background: #1d1d25;
            padding: 12px 18px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            color: #777;
            border-top: 1px solid #25252d;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .logo {
                font-size: 22px;
            }

            .nav-links {
                gap: 12px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .container {
                width: 92%;
            }
        }
    </style>

    {% block extra_css %}
    {% endblock %}

</head>


<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <a href="{% url 'home' %}" class="logo">
            Netflix
        </a>


        <div class="nav-links">

            {% if user.is_authenticated %}

                <a href="{% url 'home' %}">
                    Home
                </a>

                <a href="{% url 'add_movie' %}">
                    Add Movie
                </a>

                <a href="{% url 'logout' %}" class="btn">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}" class="btn">
                    Login
                </a>

            {% endif %}

        </div>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="container">

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        {% block content %}
        {% endblock %}

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <p>
            © 2026 netflix. All rights reserved.
        </p>

    </footer>

</body>

</html>
